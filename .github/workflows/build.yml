name: Build HC05 9S12B APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with: { fetch-depth: 0 }

    - uses: actions/setup-python@v5
      with: { python-version: '3.10' }
    - uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '17' }

    # 🛠️ Step 1: FORCE CLEAN
    - name: "🧹 FORCE CLEAN: Wipe All Runner Cache"
      run: |
        echo "🧼 Starting Force Clean..."
        rm -rf .buildozer/ .pytest_cache/ __pycache__/
        rm -rf $HOME/.local/share/python-for-android/
        rm -rf $HOME/.cache/pip/
        rm -rf $HOME/.gradle/
        sudo rm -rf /usr/local/lib/android/sdk/ndk/27* /usr/local/lib/android/sdk/ndk/28* /usr/local/lib/android/sdk/ndk/29*
        echo "✨ Runner is 100% clean!"

    # 🛠️ Step 2: System Dependencies
    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip autoconf automake libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev cmake build-essential

    # 🛠️ Step 3: Fresh Setup SDK & NDK 25.1
    - name: 🤖 Fresh Setup SDK & NDK 25.1
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        echo "ANDROID_SDK_ROOT=$HOME/android/sdk" >> $GITHUB_ENV

        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

        rm -rf latest
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest

        if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin" ]; then
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin"
        else
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        fi

        echo "$BIN_PATH" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

        export PATH="$BIN_PATH:$ANDROID_SDK_ROOT/platform-tools:$PATH"

        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

    # 🛠️ Step 4: Python Packages
    - name: 📚 Fresh Install Python packages
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install --upgrade cython==0.29.33 kivy[base] python-for-android==2024.1.21

    # 🛠️ Step 4.5: Verify source files
    - name: Verify source files
      run: |
        echo "Files in repo root:"
        ls -la
        echo ""
        [ -f main.py ] && echo "✅ main.py FOUND" || echo "❌ main.py MISSING"
        [ -f icon.png ] && echo "✅ icon.png FOUND" || echo "⚠️ icon.png MISSING (default icon use thase)"

    # 🛠️ Step 5: Build HC05 9S12B APK
    - name: Build HC05 9S12B APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH

        python3 -m pythonforandroid.toolchain apk --debug --private . \
          --package=com.gai.hc05_9s12b \
          --name="HC05 9S12B" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --dist_name=hc05_9s12b_dist \
          --requirements=hostpython3,python3,kivy,pyjnius \
          --permission=BLUETOOTH \
          --permission=BLUETOOTH_ADMIN \
          --permission=BLUETOOTH_CONNECT \
          --permission=BLUETOOTH_SCAN \
          --permission=ACCESS_FINE_LOCATION \
          --permission=ACCESS_COARSE_LOCATION \
          --icon=icon.png \
          --presplash=icon.png \
          --presplash-color=#0a192f \
          --arch=arm64-v8a \
          --android-api=34 \
          --sdk-dir=$ANDROID_SDK_ROOT \
          --ndk-dir=$ANDROID_NDK_ROOT

    # 🛠️ Step 6: APK Copy
    - name: Copy APK
      run: |
        mkdir -p APK
        NEW_APK=$(find . -type f -name "*.apk" 2>/dev/null | grep -v "APK/" | grep -v "gradle" | head -n 1)

        if [ ! -z "$NEW_APK" ]; then
          echo "🎯 APK found: $NEW_APK"
          OUTPUT_NAME="APK/HC05-9S12B-$(date +%Y%m%d-%H%M).apk"
          cp "$NEW_APK" "$OUTPUT_NAME"
          echo "✅ Saved: $OUTPUT_NAME"
        else
          echo "❌ APK not generated. Logs:"
          ls -la
          exit 1
        fi

    # 🛠️ Step 7: Push to Repo
    - name: Push to Repo
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git pull origin main --rebase || true
        git add APK/

        git diff --cached --quiet || (git commit -m "Add New HC05 9S12B APK [skip ci]" && git push origin main)
