name: Build Photon Audio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: FORCE CLEAN
      run: |
        echo "Cleaning old build files..."
        rm -rf .buildozer/ .pytest_cache/ __pycache__/
        rm -rf "$HOME/.local/share/python-for-android/" "$HOME/.cache/pip/" "$HOME/.gradle/"
        sudo rm -rf /usr/local/lib/android/sdk/ndk/27* /usr/local/lib/android/sdk/ndk/28* /usr/local/lib/android/sdk/ndk/29*
        echo "Clean completed."

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake build-essential

    - name: Setup Android SDK and NDK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        echo "ANDROID_SDK_ROOT=$HOME/android/sdk" >> $GITHUB_ENV
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        cd "$ANDROID_SDK_ROOT/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf latest
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin" ]; then
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin"
        else
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        fi
        echo "$BIN_PATH" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        export PATH="$BIN_PATH:$ANDROID_SDK_ROOT/platform-tools:$PATH"
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

    - name: Install Python packages
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install cython==0.29.33 kivy[base] pillow python-for-android==2024.1.21

    # ============================================================
    # 🔥 SAFE PATCH: PythonService.java & AndroidManifest.tmpl.xml
    # ============================================================
    - name: Patch p4a PythonService.java and AndroidManifest for Android 14
      run: |
        python3 - << 'EOF'
        import os, glob, re, pythonforandroid
        p4a_dir = os.path.dirname(pythonforandroid.__file__)

        for f in glob.glob(p4a_dir + '/**/PythonService.java', recursive=True):
            with open(f, 'r') as file:
                content = file.read()

            # 1. Android 14 Foreground Service Type
            content = re.sub(
                r'startForeground\s*\(\s*getServiceId\(\)\s*,\s*notification\s*\)\s*;',
                'if (Build.VERSION.SDK_INT >= 29) { startForeground(getServiceId(), notification, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK); } else { startForeground(getServiceId(), notification); }',
                content
            )

            # 2. Prevent NullPointerException when service restarts with null Intent
            content = re.sub(
                r'(public\s+int\s+onStartCommand\s*\(\s*Intent\s+intent\s*,\s*int\s+flags\s*,\s*int\s+startId\s*\)\s*\{)',
                r'\1 if (intent == null || intent.getExtras() == null) { return START_STICKY; }',
                content
            )

            # 3. Keep service sticky & prevent stopping when swiped from Recents
            content = content.replace('return START_NOT_STICKY;', 'return START_STICKY;')
            content = re.sub(r'stopWithTask\s*=\s*[^;]+;', 'stopWithTask = false;', content)
            content = re.sub(r'if\s*\(\s*stopWithTask\s*\)', 'if (false)', content)

            with open(f, 'w') as file:
                file.write(content)
            print('Successfully patched PythonService.java:', f)

        for f in glob.glob(p4a_dir + '/**/AndroidManifest*.tmpl.xml', recursive=True):
            with open(f, 'r') as file:
                content = file.read()

            content = re.sub(r'\s*android:stopWithTask="[^"]*"', '', content)
            content = re.sub(r'\s*android:foregroundServiceType="[^"]*"', '', content)
            new_content = content.replace(
                '<service ',
                '<service android:stopWithTask="false" android:foregroundServiceType="mediaPlayback" '
            )

            with open(f, 'w') as file:
                file.write(new_content)
            print('Successfully patched Manifest template:', f)
        EOF

    - name: Prepare app source, Logo, and Always-On Background Service
      run: |
        mkdir -p app_source
        if [ ! -f "main.py" ]; then echo "ERROR: main.py not found!"; exit 1; fi
        cp main.py app_source/main.py
        sed -i '1s/^Import /import /' app_source/main.py

        if [ -f "icon.png" ]; then
          cp icon.png app_source/icon.png
        else
          python3 -c "
        from PIL import Image, ImageDraw
        img = Image.new('RGBA', (512, 512), (10, 25, 47, 255))
        d = ImageDraw.Draw(img)
        d.ellipse([36, 36, 476, 476], outline=(0, 230, 118, 255), width=16)
        d.ellipse([96, 96, 416, 416], outline=(100, 255, 218, 255), width=22)
        d.ellipse([176, 176, 336, 336], fill=(255, 109, 0, 255), outline=(255, 171, 64, 255), width=12)
        d.ellipse([226, 226, 286, 286], fill=(10, 25, 47, 255))
        img.save('app_source/icon.png')
        "
        fi

        cat << 'EOF' > app_source/service.py
        import time
        import json
        import os
        from jnius import autoclass

        PythonService = autoclass('org.kivy.android.PythonService')
        Context = autoclass('android.content.Context')
        AudioManager = autoclass('android.media.AudioManager')
        Equalizer = autoclass('android.media.audiofx.Equalizer')
        BassBoost = autoclass('android.media.audiofx.BassBoost')
        Virtualizer = autoclass('android.media.audiofx.Virtualizer')
        LoudnessEnhancer = autoclass('android.media.audiofx.LoudnessEnhancer')
        Visualizer = autoclass('android.media.audiofx.Visualizer')
        PowerManager = autoclass('android.os.PowerManager')

        service = PythonService.mService
        service.setAutoRestartService(True)

        try:
            pm = service.getSystemService(Context.POWER_SERVICE)
            wake_lock = pm.newWakeLock(1, "PhotonAudio::ServiceWakeLock")
            wake_lock.setReferenceCounted(False)
            if not wake_lock.isHeld():
                wake_lock.acquire()
        except Exception as e:
            print("Service WakeLock Error:", e)

        audio_manager = service.getSystemService(Context.AUDIO_SERVICE)
        settings_path = os.path.join(service.getFilesDir().getAbsolutePath(), 'audio_eq_settings.json')

        eq_engine = None
        bass_engine = None
        virtualizer_engine = None
        loudness_engine = None
        visualizer = None

        cfg = {
            'volume': 50, 'bass': 50, 'low_cut': 50,
            'low_mid': 50, 'mid_upper': 50, 'treble': 50
        }

        last_mtime = 0
        last_vol = -1
        was_playing = False
        avg_bass = 0.0
        avg_lmid = 0.0
        dyn_punch = 0.0
        bass_restorer = 0.0
        lmid_restorer = 0.0
        last_lmid_restorer = 0.0
        safety_red = 0.0
        limiter_on = False
        synth_on = False
        last_bass_strength = -1
        last_amp_mb = -1
        tick = 0
        control_lost_ticks = 0

        def release_engines():
            global eq_engine, bass_engine, virtualizer_engine, loudness_engine, visualizer
            for eng in (eq_engine, bass_engine, virtualizer_engine, loudness_engine, visualizer):
                if eng is not None:
                    try:
                        eng.setEnabled(False)
                        eng.release()
                    except Exception:
                        pass
            eq_engine = None
            bass_engine = None
            virtualizer_engine = None
            loudness_engine = None
            visualizer = None

        def init_engines(force=False):
            global eq_engine, bass_engine, virtualizer_engine, loudness_engine, visualizer, last_bass_strength, last_amp_mb
            if force:
                release_engines()
                last_bass_strength = -1
                last_amp_mb = -1

            try:
                if eq_engine is None:
                    eq_engine = Equalizer(1000, 0)
                eq_engine.setEnabled(True)
            except Exception:
                eq_engine = None

            try:
                if bass_engine is None:
                    bass_engine = BassBoost(1000, 0)
                bass_engine.setEnabled(True)
            except Exception:
                bass_engine = None

            try:
                if virtualizer_engine is None:
                    virtualizer_engine = Virtualizer(1000, 0)
                virtualizer_engine.setEnabled(True)
            except Exception:
                virtualizer_engine = None

            try:
                if loudness_engine is None:
                    loudness_engine = LoudnessEnhancer(0)
                loudness_engine.setEnabled(True)
            except Exception:
                loudness_engine = None

            try:
                if visualizer is None:
                    visualizer = Visualizer(0)
                    visualizer.setCaptureSize(128)
                    visualizer.setEnabled(True)
            except Exception:
                visualizer = None

        def apply_volume():
            global last_vol
            try:
                vol = int(cfg.get('volume', 50))
                if vol != last_vol:
                    max_vol = audio_manager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                    target_vol = int(round((vol / 100.0) * max_vol))
                    audio_manager.setStreamVolume(AudioManager.STREAM_MUSIC, target_vol, 0)
                    last_vol = vol
            except Exception:
                pass

        def apply_dynamic_dsp(force=False):
            global last_bass_strength, last_amp_mb
            try:
                if bass_engine and bass_engine.hasControl():
                    base_strength = cfg['bass'] * 9.5
                    final_strength = max(0, min(1000, int(base_strength + dyn_punch + bass_restorer - safety_red)))
                    if force or abs(final_strength - last_bass_strength) >= 8:
                        bass_engine.setStrength(final_strength)
                        last_bass_strength = final_strength
            except Exception:
                pass

            try:
                if loudness_engine and loudness_engine.hasControl():
                    amp_mb = max(0, min(900, int((cfg['bass'] * 7.5) + (bass_restorer * 1.5) - safety_red)))
                    if force or abs(amp_mb - last_amp_mb) >= 8:
                        loudness_engine.setTargetGain(amp_mb)
                        last_amp_mb = amp_mb
            except Exception:
                pass

        def apply_eq():
            global last_lmid_restorer
            try:
                if not eq_engine or not eq_engine.hasControl():
                    return False

                num_bands = eq_engine.getNumberOfBands()
                level_range = eq_engine.getBandLevelRange()
                min_lvl = level_range[0]
                max_lvl = level_range[1]

                cutoff_milli = cfg['low_cut'] * 1000
                bass_drive = min(1.35, (cfg['bass'] / 100.0) * 1.30)
                lmid_amp = (cfg['low_mid'] - 50) / 50.0
                mid_ratio = (cfg['mid_upper'] - 50) / 50.0
                treble_ratio = (cfg['treble'] - 50) / 50.0
                synth_extra = 0.30 if synth_on else 0.0
                last_lmid_restorer = lmid_restorer

                for b in range(num_bands):
                    freq_range = eq_engine.getBandFreqRange(b)
                    low_f = freq_range[0]
                    high_f = freq_range[1]
                    center_f = eq_engine.getCenterFreq(b)

                    if 150000 <= center_f <= 550000:
                        if high_f <= cutoff_milli:
                            eq_engine.setBandLevel(b, min_lvl)
                        else:
                            eff_lmid = max(-1.0, min(1.0, lmid_amp + lmid_restorer))
                            lmid_lvl = int(max_lvl * eff_lmid) if eff_lmid >= 0 else int(abs(eff_lmid) * min_lvl)
                            eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, lmid_lvl)))
                    elif center_f < 150000:
                        if high_f <= cutoff_milli:
                            eq_engine.setBandLevel(b, min_lvl)
                        elif low_f < cutoff_milli < high_f:
                            above_ratio = (high_f - cutoff_milli) / float(high_f - low_f)
                            if above_ratio < 0.28 and not synth_on:
                                lvl = int(min_lvl * (1.0 - above_ratio))
                            else:
                                boost_factor = min(1.0, (bass_drive + synth_extra) * max(0.65, above_ratio))
                                lvl = int(max_lvl * boost_factor)
                            eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, lvl)))
                        else:
                            punch_lvl = int(max_lvl * min(1.0, bass_drive + synth_extra))
                            if limiter_on:
                                punch_lvl = int(punch_lvl * 0.78)
                            eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, punch_lvl)))
                    elif 550000 < center_f < 4000000:
                        coupled_ratio = max(-1.0, min(1.0, (mid_ratio * 0.75) + (lmid_amp * 0.35)))
                        mid_lvl = int(max_lvl * 0.70 * coupled_ratio)
                        eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, mid_lvl)))
                    else:
                        treble_lvl = int(max_lvl * treble_ratio)
                        eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, treble_lvl)))
            except Exception:
                return False

            try:
                if virtualizer_engine and virtualizer_engine.hasControl():
                    virtualizer_engine.setStrength(int(cfg['low_mid'] * 10))
            except Exception:
                pass

            apply_dynamic_dsp(force=True)
            return True

        init_engines(force=True)
        apply_eq()

        while True:
            try:
                # 1. ફાઇલ અપડેટ ચેક કરો (ક્યારેય સર્વિસ બંધ નહીં થાય)
                if os.path.exists(settings_path):
                    mtime = os.path.getmtime(settings_path)
                    if mtime != last_mtime:
                        with open(settings_path, 'r') as f:
                            loaded_data = json.load(f)
                        cfg.update(loaded_data)
                        last_mtime = mtime
                        apply_volume()
                        apply_eq()

                # 2. ઓડિયો વાગે છે કે નહીં તે ચેક કરો
                is_playing = audio_manager.isMusicActive()
                if is_playing and not was_playing:
                    init_engines(force=True)
                    apply_eq()
                was_playing = is_playing

                tick += 1

                if is_playing and visualizer is None and tick % 25 == 0:
                    init_engines(force=False)

                # 3. કંટ્રોલ લોસ ચેક કરો
                status_ok = True
                if eq_engine is None or not eq_engine.hasControl():
                    status_ok = False
                if bass_engine is None or not bass_engine.hasControl():
                    status_ok = False

                if not status_ok:
                    control_lost_ticks += 1
                    if control_lost_ticks >= 5:
                        init_engines(force=True)
                        apply_eq()
                        control_lost_ticks = 0
                else:
                    control_lost_ticks = 0

                if is_playing:
                    prev_synth = synth_on
                    prev_limiter = limiter_on

                    if visualizer:
                        try:
                            fft_bytes = bytearray(128)
                            if visualizer.getFft(fft_bytes) == 0:
                                low_e = 0.0
                                for i in range(2, 12, 2):
                                    r = fft_bytes[i] - 256 if fft_bytes[i] > 127 else fft_bytes[i]
                                    im = fft_bytes[i + 1] - 256 if fft_bytes[i + 1] > 127 else fft_bytes[i + 1]
                                    low_e += (r * r + im * im) ** 0.5
                                low_e /= 5.0

                                lmid_e = 0.0
                                for i in range(12, 26, 2):
                                    r = fft_bytes[i] - 256 if fft_bytes[i] > 127 else fft_bytes[i]
                                    im = fft_bytes[i + 1] - 256 if fft_bytes[i + 1] > 127 else fft_bytes[i + 1]
                                    lmid_e += (r * r + im * im) ** 0.5
                                lmid_e /= 7.0

                                avg_bass = (avg_bass * 0.85) + (low_e * 0.15)
                                avg_lmid = (avg_lmid * 0.85) + (lmid_e * 0.15)

                                delta = low_e - avg_bass
                                if delta > 11.0 and cfg['bass'] > 0:
                                    dyn_punch = min(300.0, delta * (cfg['bass'] / 32.0))
                                else:
                                    dyn_punch *= 0.60

                                if 2.0 < avg_bass < 38.0 and cfg['bass'] > 20:
                                    synth_on = True
                                    bass_restorer = min(280.0, (38.0 - avg_bass) * 7.5 * (cfg['bass'] / 100.0))
                                else:
                                    synth_on = False
                                    bass_restorer *= 0.75

                                if 1.5 < avg_lmid < 30.0 and cfg['low_mid'] > 50:
                                    lmid_restorer = min(0.45, ((30.0 - avg_lmid) / 30.0) * ((cfg['low_mid'] - 50) / 50.0))
                                else:
                                    lmid_restorer *= 0.80

                                if avg_bass > 85.0 and cfg['bass'] > 65:
                                    limiter_on = True
                                    safety_red = min(300.0, (avg_bass - 85.0) * 4.5 * (cfg['bass'] / 100.0))
                                else:
                                    limiter_on = False
                                    safety_red *= 0.70
                        except Exception:
                            try:
                                visualizer.release()
                            except Exception:
                                pass
                            visualizer = None

                    if (synth_on != prev_synth) or (limiter_on != prev_limiter) or (abs(lmid_restorer - last_lmid_restorer) > 0.05):
                        apply_eq()
                    else:
                        apply_dynamic_dsp(force=False)
            except Exception:
                pass

            time.sleep(0.12)
        EOF

        python3 -m py_compile app_source/main.py app_source/service.py
        ls -lh app_source/

    - name: Build Photon Audio APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        python3 -m pythonforandroid.toolchain apk \
          --debug \
          --private app_source \
          --package=com.photon.audio \
          --name="Photon Audio" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --orientation=portrait \
          --dist_name=photon_audio_dist \
          --requirements=hostpython3,python3,android,kivy,pyjnius \
          --service=Photondsp:service.py:foreground:sticky \
          --permission=MODIFY_AUDIO_SETTINGS \
          --permission=RECORD_AUDIO \
          --permission=BLUETOOTH \
          --permission=BLUETOOTH_ADMIN \
          --permission=BLUETOOTH_CONNECT \
          --permission=BLUETOOTH_SCAN \
          --permission=ACCESS_FINE_LOCATION \
          --permission=ACCESS_COARSE_LOCATION \
          --permission=WAKE_LOCK \
          --permission=FOREGROUND_SERVICE \
          --permission=FOREGROUND_SERVICE_MEDIA_PLAYBACK \
          --permission=REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
          --permission=RECEIVE_BOOT_COMPLETED \
          --permission=POST_NOTIFICATIONS \
          --permission=READ_MEDIA_AUDIO \
          --permission=READ_EXTERNAL_STORAGE \
          --permission=WRITE_EXTERNAL_STORAGE \
          --icon=app_source/icon.png \
          --presplash=app_source/icon.png \
          --presplash-color=#0a192f \
          --arch=arm64-v8a \
          --android-api=34 \
          --sdk-dir=$ANDROID_SDK_ROOT \
          --ndk-dir=$ANDROID_NDK_ROOT \
          --ndk-version=25.1.8937393

    - name: Copy APK
      run: |
        mkdir -p APK
        NEW_APK=$(find . -type f -name "*.apk" 2>/dev/null | grep -v "/APK/" | grep -v "/gradle/" | head -n 1)
        if [ -n "$NEW_APK" ]; then
          OUTPUT_NAME="APK/Photon-Audio-$(date +%Y%m%d-%H%M).apk"
          cp "$NEW_APK" "$OUTPUT_NAME"
          ls -lh "$OUTPUT_NAME"
        else
          find . -type f -name "*.apk" -print
          exit 1
        fi

    - name: Push APK to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout main || git checkout -b main
        git pull origin main --rebase || echo "Nothing to pull"
        git add APK/
        if [ -n "$(git status --porcelain APK/)" ]; then
          git commit -m "Add New Photon Audio APK [skip ci]"
          git push origin main
        else
          echo "No new APK changes to commit."
        fi
