name: Build Photon Audio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: FORCE CLEAN
      run: |
        echo "Cleaning old build files..."
        rm -rf .buildozer/ .pytest_cache/ __pycache__/
        rm -rf "$HOME/.local/share/python-for-android/" "$HOME/.cache/pip/" "$HOME/.gradle/"
        sudo rm -rf /usr/local/lib/android/sdk/ndk/27* /usr/local/lib/android/sdk/ndk/28* /usr/local/lib/android/sdk/ndk/29*
        echo "Clean completed."

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake build-essential

    - name: Setup Android SDK and NDK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        echo "ANDROID_SDK_ROOT=$HOME/android/sdk" >> $GITHUB_ENV
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        cd "$ANDROID_SDK_ROOT/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf latest
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin" ]; then
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin"
        else
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        fi
        echo "$BIN_PATH" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        export PATH="$BIN_PATH:$ANDROID_SDK_ROOT/platform-tools:$PATH"
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

    - name: Install Python packages
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install cython==0.29.33 kivy[base] python-for-android==2024.1.21

    - name: Prepare app source and Always-On Background Service
      run: |
        mkdir -p app_source
        if [ ! -f "main.py" ]; then echo "ERROR: main.py not found!"; exit 1; fi
        cp main.py app_source/main.py
        # Auto-fix accidental capital 'Import' on line 1 from mobile keyboard
        sed -i '1s/^Import /import /' app_source/main.py

        # Generate immortal background DSP service (runs even when UI is killed)
        cat << 'EOF' > app_source/service.py
        import time
        import json
        import os
        from jnius import autoclass

        PythonService = autoclass('org.kivy.android.PythonService')
        Context = autoclass('android.content.Context')
        AudioManager = autoclass('android.media.AudioManager')
        Equalizer = autoclass('android.media.audiofx.Equalizer')
        BassBoost = autoclass('android.media.audiofx.BassBoost')
        Visualizer = autoclass('android.media.audiofx.Visualizer')
        PowerManager = autoclass('android.os.PowerManager')

        service = PythonService.mService
        service.setAutoRestartService(True)

        # Keep CPU awake when screen is locked
        try:
            pm = service.getSystemService(Context.POWER_SERVICE)
            wake_lock = pm.newWakeLock(1, "PhotonAudio::ServiceWakeLock")
            if not wake_lock.isHeld():
                wake_lock.acquire()
        except Exception as e:
            print("Service WakeLock Error:", e)

        audio_manager = service.getSystemService(Context.AUDIO_SERVICE)
        settings_path = os.path.join(service.getFilesDir().getAbsolutePath(), 'audio_eq_settings.json')

        eq_engine = None
        bass_engine = None
        visualizer = None

        cfg = {
            'always_on': True,
            'volume': 50,
            'bass': 50,
            'low_cut': 50,
            'low_mid': 50,
            'mid_upper': 50,
            'treble': 50
        }

        last_mtime = 0
        was_playing = False
        avg_bass = 0.0
        dyn_punch = 0.0
        safety_red = 0.0
        limiter_on = False
        tick = 0

        def init_engines():
            global eq_engine, bass_engine, visualizer
            try:
                if eq_engine is None:
                    eq_engine = Equalizer(100, 0)
                eq_engine.setEnabled(True)
            except Exception:
                eq_engine = None
            try:
                if bass_engine is None:
                    bass_engine = BassBoost(100, 0)
                bass_engine.setEnabled(True)
            except Exception:
                bass_engine = None
            try:
                if visualizer is None:
                    visualizer = Visualizer(0)
                    visualizer.setCaptureSize(128)
                    visualizer.setEnabled(True)
            except Exception:
                visualizer = None

        def apply_eq():
            try:
                if not eq_engine:
                    return
                num_bands = eq_engine.getNumberOfBands()
                level_range = eq_engine.getBandLevelRange()
                min_lvl = level_range[0]
                max_lvl = level_range[1]

                cutoff_milli = cfg['low_cut'] * 1000
                bass_ratio = cfg['bass'] / 100.0
                lmid_ratio = (cfg['low_mid'] - 50) / 50.0
                mid_ratio = (cfg['mid_upper'] - 50) / 50.0
                treble_ratio = (cfg['treble'] - 50) / 50.0

                for b in range(num_bands):
                    freq_range = eq_engine.getBandFreqRange(b)
                    low_f = freq_range[0]
                    high_f = freq_range[1]
                    center_f = eq_engine.getCenterFreq(b)

                    if high_f <= cutoff_milli:
                        eq_engine.setBandLevel(b, min_lvl)
                    elif low_f < cutoff_milli < high_f:
                        above_ratio = (high_f - cutoff_milli) / float(high_f - low_f)
                        if above_ratio < 0.4:
                            lvl = int(min_lvl * (1.0 - above_ratio))
                        else:
                            lvl = int(max_lvl * 0.7 * bass_ratio * above_ratio)
                        eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, lvl)))
                    else:
                        if center_f <= 180000:
                            punch_lvl = int(max_lvl * 0.85 * bass_ratio)
                            if limiter_on:
                                punch_lvl = int(punch_lvl * 0.72)
                            eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, punch_lvl)))
                        elif 240000 <= center_f <= 500000:
                            lmid_lvl = int(max_lvl * 0.6 * lmid_ratio)
                            eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, lmid_lvl)))
                        elif 500000 < center_f < 4000000:
                            mid_lvl = int(max_lvl * 0.6 * mid_ratio)
                            eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, mid_lvl)))
                        else:
                            treble_lvl = int(max_lvl * treble_ratio)
                            eq_engine.setBandLevel(b, max(min_lvl, min(max_lvl, treble_lvl)))
            except Exception:
                pass

        init_engines()

        while True:
            try:
                if os.path.exists(settings_path):
                    mtime = os.path.getmtime(settings_path)
                    if mtime != last_mtime:
                        last_mtime = mtime
                        with open(settings_path, 'r') as f:
                            cfg.update(json.load(f))
                        if not cfg.get('always_on', True):
                            service.setAutoRestartService(False)
                            service.stopSelf()
                            break
                        init_engines()
                        apply_eq()

                is_playing = audio_manager.isMusicActive()
                if is_playing and not was_playing:
                    # Song just started in any app -> Lock EQ & apply immediately
                    init_engines()
                    apply_eq()
                was_playing = is_playing

                # Periodic re-enforcement every ~4 seconds while music plays
                tick += 1
                if is_playing and tick % 25 == 0:
                    init_engines()
                    apply_eq()

                # Real-time Smart Beat Punch & Limiter in background
                if is_playing and visualizer and bass_engine:
                    fft_bytes = bytearray(128)
                    if visualizer.getFft(fft_bytes) == 0:
                        low_e = 0.0
                        for i in range(2, 12, 2):
                            r = fft_bytes[i] - 256 if fft_bytes[i] > 127 else fft_bytes[i]
                            im = fft_bytes[i + 1] - 256 if fft_bytes[i + 1] > 127 else fft_bytes[i + 1]
                            low_e += (r * r + im * im) ** 0.5
                        low_e /= 5.0
                        avg_bass = (avg_bass * 0.88) + (low_e * 0.12)
                        delta = low_e - avg_bass
                        if delta > 14.0 and cfg['bass'] > 0:
                            dyn_punch = min(200.0, delta * (cfg['bass'] / 45.0))
                        else:
                            dyn_punch *= 0.55

                        if avg_bass > 72.0 and cfg['bass'] > 55:
                            limiter_on = True
                            safety_red = min(350.0, (avg_bass - 72.0) * 5.5 * (cfg['bass'] / 100.0))
                        else:
                            limiter_on = False
                            safety_red *= 0.7

                        strength = int((cfg['bass'] * 6.5) + dyn_punch - safety_red)
                        bass_engine.setStrength(max(0, min(1000, strength)))
            except Exception:
                pass

            time.sleep(0.15)
        EOF

        python3 -m py_compile app_source/main.py app_source/service.py
        ls -lh app_source/

    - name: Build Photon Audio APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        python3 -m pythonforandroid.toolchain apk \
          --debug \
          --private app_source \
          --package=com.photon.audio \
          --name="Photon Audio" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --orientation=portrait \
          --dist_name=photon_audio_dist \
          --requirements=hostpython3,python3,android,kivy,pyjnius \
          --service=Photondsp:service.py \
          --permission=MODIFY_AUDIO_SETTINGS \
          --permission=RECORD_AUDIO \
          --permission=BLUETOOTH \
          --permission=BLUETOOTH_ADMIN \
          --permission=BLUETOOTH_CONNECT \
          --permission=BLUETOOTH_SCAN \
          --permission=ACCESS_FINE_LOCATION \
          --permission=ACCESS_COARSE_LOCATION \
          --permission=WAKE_LOCK \
          --permission=FOREGROUND_SERVICE \
          --permission=FOREGROUND_SERVICE_MEDIA_PLAYBACK \
          --permission=REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
          --permission=SYSTEM_ALERT_WINDOW \
          --permission=RECEIVE_BOOT_COMPLETED \
          --permission=POST_NOTIFICATIONS \
          --permission=READ_MEDIA_AUDIO \
          --permission=READ_EXTERNAL_STORAGE \
          --permission=WRITE_EXTERNAL_STORAGE \
          --arch=arm64-v8a \
          --android-api=34 \
          --sdk-dir=$ANDROID_SDK_ROOT \
          --ndk-dir=$ANDROID_NDK_ROOT \
          --ndk-version=25.1.8937393

    - name: Copy APK
      run: |
        mkdir -p APK
        NEW_APK=$(find . -type f -name "*.apk" 2>/dev/null | grep -v "/APK/" | grep -v "/gradle/" | head -n 1)
        if [ -n "$NEW_APK" ]; then
          OUTPUT_NAME="APK/Photon-Audio-$(date +%Y%m%d-%H%M).apk"
          cp "$NEW_APK" "$OUTPUT_NAME"
          ls -lh "$OUTPUT_NAME"
        else
          find . -type f -name "*.apk" -print
          exit 1
        fi

    - name: Push APK to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout main || git checkout -b main
        git pull origin main --rebase || echo "Nothing to pull"
        git add APK/
        if [ -n "$(git status --porcelain APK/)" ]; then
          git commit -m "Add New Photon Audio APK [skip ci]"
          git push origin main
        else
          echo "No new APK changes to commit."
        fi
