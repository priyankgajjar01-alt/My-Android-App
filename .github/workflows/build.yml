name: Build Photon Audio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # ============================================================
    # 🎯 AUTO VERSIONING STEP: વર્ઝન વાંચે, વધારે અને સેવ કરે
    # ============================================================
    - name: Read and Increment Version
      id: versioning
      run: |
        if [ -f "version.txt" ]; then
          CURRENT_VERSION=$(cat version.txt)
        else
          CURRENT_VERSION="3.3"
        fi
        echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
        
        # આગલા વખતના બિલ્ડ માટે વર્ઝન વધારો (3.3 -> 3.4)
        MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
        MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
        MINOR=$((MINOR + 1))
        NEXT_VERSION="$MAJOR.$MINOR"
        
        echo $NEXT_VERSION > version.txt
        echo "Current Build Version: v$CURRENT_VERSION"
        echo "Next Build Version will be: v$NEXT_VERSION"

    - name: FORCE CLEAN
      run: |
        echo "Cleaning old build files..."
        rm -rf .buildozer/ .pytest_cache/ __pycache__/
        rm -rf "$HOME/.local/share/python-for-android/" "$HOME/.cache/pip/" "$HOME/.gradle/"
        sudo rm -rf /usr/local/lib/android/sdk/ndk/27* /usr/local/lib/android/sdk/ndk/28* /usr/local/lib/android/sdk/ndk/29*
        echo "Clean completed."

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake build-essential

    - name: Setup Android SDK and NDK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        echo "ANDROID_SDK_ROOT=$HOME/android/sdk" >> $GITHUB_ENV
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        cd "$ANDROID_SDK_ROOT/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        rm -rf latest
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin" ]; then
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/cmdline-tools/bin"
        else
          BIN_PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
        fi
        echo "$BIN_PATH" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        export PATH="$BIN_PATH:$ANDROID_SDK_ROOT/platform-tools:$PATH"
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

    - name: Install Python packages
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install cython==0.29.33 kivy[base] pillow python-for-android==2024.1.21

    - name: Patch p4a PythonService.java and AndroidManifest for Android 14
      run: |
        python3 - << 'EOF'
        import os, glob, re, pythonforandroid
        p4a_dir = os.path.dirname(pythonforandroid.__file__)

        helper_java_methods = """
            public void showToast(final String message) {
                try {
                    new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                        @Override
                        public void run() {
                            try {
                                android.widget.Toast.makeText(getApplicationContext(), message, android.widget.Toast.LENGTH_SHORT).show();
                            } catch (Exception e) {}
                        }
                    });
                } catch (Exception e) {}
            }

            public void updateDspNotification(final boolean isActive, final String subText) {
                try {
                    new android.os.Handler(android.os.Looper.getMainLooper()).post(new Runnable() {
                        @Override
                        public void run() {
                            try {
                                android.content.Context ctx = getApplicationContext();
                                android.app.NotificationManager nm = (android.app.NotificationManager) ctx.getSystemService(android.content.Context.NOTIFICATION_SERVICE);
                                String channelId = "photon_dsp_topbar_channel";
                                if (android.os.Build.VERSION.SDK_INT >= 26) {
                                    android.app.NotificationChannel chan = new android.app.NotificationChannel(
                                        channelId, "Photon Audio DSP Status", android.app.NotificationManager.IMPORTANCE_DEFAULT
                                    );
                                    chan.setSound(null, null); chan.enableVibration(false); chan.setShowBadge(false);
                                    nm.createNotificationChannel(chan);
                                }
                                android.content.Intent launchIntent = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                                int flags = android.os.Build.VERSION.SDK_INT >= 23 ? (android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE) : android.app.PendingIntent.FLAG_UPDATE_CURRENT;
                                android.app.PendingIntent pi = android.app.PendingIntent.getActivity(ctx, 0, launchIntent, flags);

                                int iconRes = ctx.getApplicationInfo().icon;
                                if (iconRes == 0) iconRes = android.R.drawable.sym_def_app_icon;
                                String title = isActive ? "🟢 Photon Audio DSP: ACTIVE" : "⏸ Photon Audio DSP: PAUSED";

                                android.app.Notification.Builder builder;
                                if (android.os.Build.VERSION.SDK_INT >= 26) builder = new android.app.Notification.Builder(ctx, channelId);
                                else builder = new android.app.Notification.Builder(ctx);

                                builder.setContentTitle(title).setContentText(subText).setSmallIcon(iconRes).setContentIntent(pi).setOnlyAlertOnce(true).setOngoing(true);
                                nm.notify(getServiceId(), builder.build());
                            } catch (Exception e) {}
                        }
                    });
                } catch (Exception e) {}
            }
        """

        for f in glob.glob(p4a_dir + '/**/PythonService.java', recursive=True):
            with open(f, 'r') as file:
                content = file.read()

            content = re.sub(
                r'startForeground\s*\(\s*([^,]+)\s*,\s*([^)]+)\s*\)\s*;',
                r'if (android.os.Build.VERSION.SDK_INT >= 29) { startForeground(\1, \2, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK); } else { startForeground(\1, \2); }',
                content
            )

            content = re.sub(
                r'(public\s+int\s+onStartCommand\s*\(\s*Intent\s+intent\s*,\s*int\s+flags\s*,\s*int\s+startId\s*\)\s*\{)',
                r'\1 if (intent == null || intent.getExtras() == null) { return START_STICKY; }',
                content
            )

            content = content.replace('return START_NOT_STICKY;', 'return START_STICKY;')
            content = re.sub(r'stopWithTask\s*=\s*[^;]+;', 'stopWithTask = false;', content)
            content = re.sub(r'if\s*\(\s*stopWithTask\s*\)', 'if (false)', content)

            if 'public void showToast(' not in content:
                last_brace = content.rfind('}')
                if last_brace != -1:
                    content = content[:last_brace] + helper_java_methods + '\n}\n'

            with open(f, 'w') as file:
                file.write(content)
            print('Successfully patched PythonService.java:', f)

        for f in glob.glob(p4a_dir + '/**/AndroidManifest*.tmpl.xml', recursive=True):
            with open(f, 'r') as file:
                content = file.read()

            content = re.sub(r'\s*android:stopWithTask="[^"]*"', '', content)
            content = re.sub(r'\s*android:foregroundServiceType="[^"]*"', '', content)
            new_content = content.replace(
                '<service ',
                '<service android:stopWithTask="false" android:foregroundServiceType="mediaPlayback" '
            )

            with open(f, 'w') as file:
                file.write(new_content)
            print('Successfully patched Manifest template:', f)
        EOF

    - name: Prepare app source and Logo
      run: |
        mkdir -p app_source
        if [ ! -f "main.py" ]; then echo "ERROR: main.py not found!"; exit 1; fi
        if [ ! -f "service.py" ]; then echo "ERROR: service.py not found!"; exit 1; fi
        
        cp main.py app_source/main.py
        cp service.py app_source/service.py

        if [ -f "icon.png" ]; then
          cp icon.png app_source/icon.png
        else
          python3 -c "
        from PIL import Image, ImageDraw
        img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
        d = ImageDraw.Draw(img)
        d.ellipse([48, 48, 464, 464], outline=(100, 255, 218, 255), width=48)
        img.save('app_source/icon.png')
        "
        fi

        python3 -m py_compile app_source/main.py app_source/service.py
        ls -lh app_source/

    - name: Build Photon Audio APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android/sdk
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.1.8937393
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        python3 -m pythonforandroid.toolchain apk \
          --debug \
          --private app_source \
          --package=com.photon.audio \
          --name="Photon Audio" \
          --version=${{ env.CURRENT_VERSION }} \
          --bootstrap=sdl2 \
          --orientation=portrait \
          --dist_name=photon_audio_dist \
          --requirements=hostpython3,python3,android,kivy,pyjnius \
          --service=Photondsp:service.py:foreground:sticky \
          --permission=MODIFY_AUDIO_SETTINGS \
          --permission=BLUETOOTH \
          --permission=BLUETOOTH_ADMIN \
          --permission=BLUETOOTH_CONNECT \
          --permission=BLUETOOTH_SCAN \
          --permission=WAKE_LOCK \
          --permission=FOREGROUND_SERVICE \
          --permission=FOREGROUND_SERVICE_MEDIA_PLAYBACK \
          --permission=REQUEST_IGNORE_BATTERY_OPTIMIZATIONS \
          --permission=RECEIVE_BOOT_COMPLETED \
          --permission=POST_NOTIFICATIONS \
          --permission=READ_MEDIA_AUDIO \
          --permission=READ_EXTERNAL_STORAGE \
          --permission=WRITE_EXTERNAL_STORAGE \
          --icon=app_source/icon.png \
          --presplash=app_source/icon.png \
          --presplash-color=#0a192f \
          --arch=arm64-v8a \
          --android-api=34 \
          --sdk-dir=$ANDROID_SDK_ROOT \
          --ndk-dir=$ANDROID_NDK_ROOT \
          --ndk-version=25.1.8937393

    - name: Copy APK
      run: |
        mkdir -p APK
        NEW_APK=$(find . -type f -name "*.apk" 2>/dev/null | grep -v "/APK/" | grep -v "/gradle/" | head -n 1)
        if [ -n "$NEW_APK" ]; then
          # 🎯 વર્ઝન સાથેનું નામ સેવ કરો (દા.ત. Photon-Audio-v3.3.apk)
          OUTPUT_NAME="APK/Photon-Audio-v${{ env.CURRENT_VERSION }}.apk"
          cp "$NEW_APK" "$OUTPUT_NAME"
          ls -lh "$OUTPUT_NAME"
        else
          find . -type f -name "*.apk" -print
          exit 1
        fi

    - name: Push APK and version.txt to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout main || git checkout -b main
        git pull origin main --rebase || echo "Nothing to pull"
        
        # 🎯 APK ફોલ્ડર અને version.txt બંનેને સેવ કરો જેથી આગલી વખતે વર્ઝન વધે
        git add APK/ version.txt
        
        if [ -n "$(git status --porcelain APK/ version.txt)" ]; then
          git commit -m "Add Photon Audio APK v${{ env.CURRENT_VERSION }} [skip ci]"
          git push origin main
        else
          echo "No new APK changes to commit."
        fi
